<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Shader Sandbox 300x300 – 水底の揺らぎ</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 300px;
      height: 300px;
      border: 1px solid #bfbfbf;
    }
  </style>
</head>
<body>
<canvas id="glcanvas" width="300" height="300"></canvas>

<script>
// ========== Vertex Shader ==========
const VERT_SRC = `#version 300 es
in vec2 a_position;
void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

// ========== Fragment Shader ==========
const FRAG_SRC = `#version 300 es
precision mediump float;
out vec4 colour_out;

uniform vec2 u_resolution;
uniform vec2 u_mouse;
uniform float u_time;

// --- webgl-noise の Simplex ノイズ関数（2D版） ---
// 以下は簡略化版ですが、実際には webgl-noise のコードをそのまま貼り込むことを想定。
// 実際のソースは “snoise(vec2)” または “snoise(vec3)” など。
//
// Reference: https://github.com/ashima/webgl-noise :contentReference[oaicite:1]{index=1}

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                      -0.577350269189626, 0.024390243902439);
  // First corner
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);

  // Other corners
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;

  // Permutations
  i = mod289(i); // Avoid truncation effects in permutation
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                + i.x + vec3(0.0, i1.x, 1.0 ));

  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
                          dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;

  // Gradients: 41 points uniformly over a line, mapped onto a diamond.
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;

  // Normalize gradients implicitly by scaling m
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0+h*h);

  // Compute final noise value at P
  vec3 g;
  g.x  = a0.x  * x0.x + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
// --- end Simplex ノイズ関数 ---

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution.xy;
  // アスペクト比補正
  uv = uv * u_resolution.xy / min(u_resolution.x, u_resolution.y);

  float time = u_time * 0.2;

  // 多重スケールノイズ
  float base = snoise(uv * 2.0 + vec2(0.0, time));
  float detail = snoise(uv * 8.0 - vec2(time * 0.5, time * 0.3));
  float n = mix(base, detail, 0.6);

  // 水底らしい色合い／明るさ変化
  vec3 deepColor   = vec3(0.02, 0.10, 0.14);
  vec3 shallowColor= vec3(0.10, 0.35, 0.45);
  float depthFactor= smoothstep(0.0, 1.0, uv.y); // 上＝浅、下＝深として簡易
  vec3 col = mix(shallowColor, deepColor, depthFactor);
  col += n * 0.15; // ノイズによる模様・揺らぎ
  // 少し明るさの揺らぎをかける
  col *= 1.0 + 0.2 * base;

  colour_out = vec4(col, 1.0);
}
`;

// ========== WebGL Setup ==========
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2');
if (!gl) alert("WebGL2 not supported");

// ブレンド設定（将来的に使うなら残しておく）
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

function compileShader(gl, type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    throw new Error("Shader compile error");
  }
  return shader;
}

const vs = compileShader(gl, gl.VERTEX_SHADER, VERT_SRC);
const fs = compileShader(gl, gl.FRAGMENT_SHADER, FRAG_SRC);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
  throw new Error("Program link error");
}
gl.useProgram(program);

// Fullscreen triangle
const quadVerts = new Float32Array([
  -1, -1,
   3, -1,
  -1,  3,
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);

const loc = gl.getAttribLocation(program, "a_position");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// Uniform locations
const uResolution = gl.getUniformLocation(program, "u_resolution");
const uMouse      = gl.getUniformLocation(program, "u_mouse");
const uTime       = gl.getUniformLocation(program, "u_time");

let mouseX = 0, mouseY = 0;
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = rect.height - (e.clientY - rect.top);
});

// Render loop
const start = performance.now();
function render() {
  const t = (performance.now() - start) * 0.001;

  gl.useProgram(program);
  gl.bindVertexArray(vao);

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform2f(uMouse, mouseX, mouseY);
  gl.uniform1f(uTime, t);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
