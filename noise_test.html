<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Shader Sandbox 300×300 – Cellular/Worley Noise 2D Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 300px;
      height: 300px;
      border: 1px solid #bfbfbf;
    }
  </style>
</head>
<body>
<canvas id="glcanvas" width="300" height="300"></canvas>

<script>
// ========== Vertex Shader ==========
const VERT_SRC = `#version 300 es
in vec2 a_position;
void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

// ========== Fragment Shader ==========
const FRAG_SRC = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2 u_resolution;
uniform float u_time;

// Modulo 289 without a division (only multiplications)
vec3 mod289(vec3 x) {
  return x - floor(x * (1.0 / 289.0)) * 289.0;
}
vec2 mod289(vec2 x) {
  return x - floor(x * (1.0 / 289.0)) * 289.0;
}

// Modulo 7 without a division
vec3 mod7(vec3 x) {
  return x - floor(x * (1.0 / 7.0)) * 7.0;
}

// Permutation polynomial: (34x^2 + x) mod 289
vec3 permute(vec3 x) {
  return mod289((34.0 * x + 1.0) * x);
}

// Cellular noise, returning F1 and F2 in a vec2.
// Standard 3x3 search window for good F1 and F2 values
vec2 cellular(vec2 P) {
  const float K   = 0.142857142857; // 1/7
  const float Ko  = 0.428571428571; // 3/7
  const float jitter = 1.0;         // Less gives more regular pattern

  vec2 Pi = mod289(floor(P));
  vec2 Pf = fract(P);

  vec3 oi = vec3(-1.0, 0.0, 1.0);
  vec3 of = vec3(-0.5, 0.5, 1.5);

  vec3 px = permute(Pi.x + oi);
  vec3 p  = permute(px.x + Pi.y + oi); // p11, p12, p13

  vec3 ox = fract(p * K) - Ko;
  vec3 oy = mod7(floor(p * K))*K - Ko;

  vec3 dx = Pf.x + 0.5 + jitter * ox;
  vec3 dy = Pf.y - of + jitter * oy;
  vec3 d1 = dx * dx + dy * dy; // d11, d12 and d13, squared

  p = permute(px.y + Pi.y + oi); // p21, p22 and p23
  ox = fract(p * K) - Ko;
  oy = mod7(floor(p * K))*K - Ko;
  dx = Pf.x - 0.5 + jitter * ox;
  dy = Pf.y - of + jitter * oy;
  vec3 d2 = dx * dx + dy * dy; // d21, d22 and d23, squared

  p = permute(px.z + Pi.y + oi); // p31, p32 and p33
  ox = fract(p * K) - Ko;
  oy = mod7(floor(p * K))*K - Ko;
  dx = Pf.x - 1.5 + jitter * ox;
  dy = Pf.y - of + jitter * oy;
  vec3 d3 = dx * dx + dy * dy; // d31, d32 and d33, squared

  // Sort out the two smallest distances (F1, F2)
  vec3 d1a = min(d1, d2);
  d2 = max(d1, d2); // Swap to keep candidates for F2
  d2 = min(d2, d3); // neither F1 nor F2 are now in d3
  d1 = min(d1a, d2); // F1 is now in d1
  d2 = max(d1a, d2); // Swap to keep candidates for F2

  d1.xy = (d1.x < d1.y) ? d1.xy : d1.yx; // Swap if smaller
  d1.xz = (d1.x < d1.z) ? d1.xz : d1.zx; // F1 is in d1.x
  d1.yz = min(d1.yz, d2.yz);              // F2 is now not in d2.yz
  d1.y  = min(d1.y, d1.z);                // nor in d1.z
  d1.y  = min(d1.y, d2.x);                // F2 is in d1.y, we're done.

  return sqrt(d1.xy);
}

// Demo mapping
float colorMapping(vec2 xy) {
  return cellular(xy).x * 2.0 - 1.0;
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_resolution.xy;
  // Maintain aspect ratio
  uv = uv * u_resolution.xy / min(u_resolution.x, u_resolution.y);

  float n = colorMapping(uv * 4.0);

  vec3 col = vec3(0.5 + 0.5 * vec3(n, n, n));
  float alpha = (col.r + col.g + col.b < 0.01) ? 0.0 : 1.0;
  fragColor = vec4(col, alpha);
}
`;

// ========== WebGL2 Setup ==========
const canvas = document.getElementById('glcanvas');
const gl     = canvas.getContext('webgl2');
if (!gl) {
  alert("WebGL2 not supported");
  throw new Error("No WebGL2");
}

function compileShader(gl, type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    throw new Error("Shader compile failure");
  }
  return shader;
}

const vs      = compileShader(gl, gl.VERTEX_SHADER,   VERT_SRC);
const fs      = compileShader(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
  throw new Error("Program link failure");
}
gl.useProgram(program);

// Fullscreen triangle setup
const quadVerts = new Float32Array([
  -1, -1,
   3, -1,
  -1,  3
]);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(program, "a_position");
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uResLoc  = gl.getUniformLocation(program, "u_resolution");
const uTimeLoc = gl.getUniformLocation(program, "u_time");

const start = performance.now();
function render() {
  const t = (performance.now() - start) * 0.001;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uResLoc, canvas.width, canvas.height);
  gl.uniform1f(uTimeLoc, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(render);
}
render();
</script>

</body>
</html>
