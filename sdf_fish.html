<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Shader Sandbox 300x300</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 300px;
      height: 300px;
      border: 1px solid #bfbfbf;
    }
  </style>
</head>
<body>
<canvas id="glcanvas" width="300" height="300"></canvas>

<script>
// ========== Vertex Shader ==========
const VERT_SRC = `#version 300 es
in vec2 a_position;
void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

// ========== Fragment Shader ==========
const FRAG_SRC = `#version 300 es
precision mediump float;
out vec4 colour_out;

uniform vec2 u_resolution;
uniform vec2 u_mouse;
uniform float u_time;

// 2乗ノルムのヘルパー
float dot2(vec2 v) {
    return dot(v, v);
}

float swimPhase() {
    return u_time * 0.8;
}

// 1D Hash. 10 and 10000 aren't ideal, but oh well, good enough
float hash1(float n) {
    return fract(sin(n * 10.0) * 10000.0);
}

// ベジエ曲線 SDF
float sdBezier(in vec2 pos, in vec2 A, in vec2 B, in vec2 C)
{
    vec2 a = B - A;
    vec2 b = A - 2.0 * B + C;
    vec2 c = a * 2.0;
    vec2 d = A - pos;

    float kk = 1.0 / dot(b, b + 1e-9); // ゼロ割防止の微小項
    float kx = kk * dot(a, b);
    float ky = kk * (2.0 * dot(a, a) + dot(d, b)) / 3.0;
    float kz = kk * dot(d, a);

    float res = 0.0;
    float p = ky - kx * kx;
    float p3 = p * p * p;
    float q = kx * (2.0 * kx * kx - 3.0 * ky) + kz;
    float h = q * q + 4.0 * p3;

    if (h >= 0.0)
    {
        h = sqrt(h);
        vec2 x = (vec2(h, -h) - q) / 2.0;
        vec2 uv = sign(x) * pow(abs(x), vec2(1.0 / 3.0));
        float t = clamp(uv.x + uv.y - kx, 0.0, 1.0);
        res = dot2(d + (c + b * t) * t);
    }
    else
    {
        float z = sqrt(-p);
        float v = acos(q / (p * z * 2.0)) / 3.0;
        float m = cos(v);
        float n = sin(v) * 1.732050808; // sqrt(3)
        vec3 t = clamp(vec3(m + m, -n - m, n - m) * z - kx, 0.0, 1.0);
        res = min(
            dot2(d + (c + b * t.x) * t.x),
            dot2(d + (c + b * t.y) * t.y)
        );
    }
    return sqrt(res);
}



// ================== 尾びれ用ベジエ + アニメーション関数 ==================
float sdTailFin(
    vec2 p,
    vec2 A0, vec2 B0, vec2 C0,
    float freq,
    float ampB, float ampC,
    float phaseC,
    float thickness   // ← 追加：この線の太さ
) {
    // A0 から見た相対ベクトル
    vec2 AB0 = B0 - A0;
    vec2 AC0 = C0 - A0;

    // 半径（A0 からの距離）を固定
    float rB = length(AB0);
    float rC = length(AC0);

    // 基本角度（静止時の方向）
    float baseAngleB = atan(AB0.y, AB0.x);
    float baseAngleC = atan(AC0.y, AC0.x);

    // 時間による角度変化
    float t = u_time;

    float angleB = baseAngleB + ampB * sin(swimPhase());
    float angleC = baseAngleC + ampC * sin(swimPhase() + phaseC);

    // 円周上での新しい位置
    vec2 A = A0;
    vec2 B = A0 + rB * vec2(cos(angleB), sin(angleB));
    vec2 C = A0 + rC * vec2(cos(angleC), sin(angleC));

    // ベジエ曲線からの距離 - thickness で有厚SDFに
    float dCenter = sdBezier(p, A, B, C);
    return dCenter - thickness;
}

// -------------------- 基本SDF --------------------
float sdCircle(vec2 p, vec2 c, float r) {
    return length(p - c) - r;
}

// -------------------- 背骨位置 spinePos(t) --------------------
// 胴体・尾びれの両方で使う
vec2 spinePos(float t) {
    vec2 headPos = vec2(0.2, 0.6);
    vec2 tailPos = vec2(0.1, -0.3);
    vec2 spine = mix(headPos, tailPos, t);

    // S字に少し曲げる（元のsdBettaBodyと同じロジック）
    float bend = -0.2 * sin(3.14159 * (t - 0.2) + swimPhase());
    spine.x += bend * 0.4;

    return spine;
}

// -------------------- 半径プロファイル（Catmull–Rom） --------------------
// 制御点: key.x = t(0〜1), key.y = 半径
const int NUM_KEYS = 5;
const vec2 radiusKeys[NUM_KEYS] = vec2[NUM_KEYS](
    vec2(0.00, 0.10),  // 頭先端
    vec2(0.05, 0.12),  // 首
    vec2(0.20, 0.16),  // 胴体最大
    vec2(0.80, 0.06),  // 尾の付け根
    vec2(1.00, 0.02)   // 尾の先端
);

// Catmull–Rom スプライン（スカラー版）
float catmullRom(float p0, float p1, float p2, float p3, float s) {
    float s2 = s * s;
    float s3 = s2 * s;
    return 0.5 * (
        2.0 * p1 +
        (-p0 + p2) * s +
        (2.0 * p0 - 5.0 * p1 + 4.0 * p2 - p3) * s2 +
        (-p0 + 3.0 * p1 - 3.0 * p2 + p3) * s3
    );
}

// t(0〜1) に対して、滑らかな太さを返す
float radiusProfile(float t) {
    // 範囲外は端の値でクランプ
    if (t <= radiusKeys[0].x) return radiusKeys[0].y;
    if (t >= radiusKeys[NUM_KEYS-1].x) return radiusKeys[NUM_KEYS-1].y;

    // t が属する区間 [key[i].x, key[i+1].x] を探す
    int seg = 0;
    for (int i = 0; i < NUM_KEYS - 1; ++i) {
        if (t >= radiusKeys[i].x && t <= radiusKeys[i+1].x) {
            seg = i;
            break;
        }
    }

    int i1 = seg;
    int i2 = seg + 1;
    int i0 = max(i1 - 1, 0);
    int i3 = min(i2 + 1, NUM_KEYS - 1);

    float t1 = radiusKeys[i1].x;
    float t2 = radiusKeys[i2].x;

    // 区間内のローカルパラメータ s ∈ [0,1]
    float s = (t - t1) / (t2 - t1);

    float p0 = radiusKeys[i0].y;
    float p1 = radiusKeys[i1].y;
    float p2 = radiusKeys[i2].y;
    float p3 = radiusKeys[i3].y;

    return catmullRom(p0, p1, p2, p3, s);
}

// -------------------- ベタ胴体 SDF --------------------
float sdBettaBody(vec2 p) {
    float d = 1e9;
    const int N = 30;  // 円の数（多いほど滑らか）

    for (int i = 0; i < N; ++i) {
        float t = float(i) / float(N - 1);  // 0.0〜1.0

        // 背骨の位置 C(t)
        vec2 spine = spinePos(t);

        // 半径 r(t) をスムーズなプロファイルから取得
        float radius = radiusProfile(t);

        float dc = sdCircle(p, spine, radius);
        d = min(d, dc);
    }
    return d;  // 負: 内側, 正: 外側
}

// -------------------- 尾びれ (複数線) SDF --------------------
// 胴体の尻尾側の位置を基準に、扇状に複数の尾びれ線を生やす
float sdAllTailFins(vec2 p) {
    // 尾の付け根あたりの位置
    float tTailBase = 0.9;
    vec2 tailBase = spinePos(tTailBase);

    // 尾の方向（spineの接線近似）
    vec2 dir = normalize(spinePos(1.0) - spinePos(0.8) + vec2(1e-5));
    float baseAngle = atan(dir.y, dir.x);

    const int NUM_FINS = 24;  // 扇状の線の本数（奇数だと真ん中が1本になる）
    float spread = 1.2;       // 全体の開き角（ラジアン）

    float d = 1e9;

    for (int i = 0; i < NUM_FINS; ++i) {
        float fi = float(i);

        float u = (fi / float(NUM_FINS - 1)) - 0.5; // -0.5〜0.5
        float angleOffset = u * spread;
        float angle = baseAngle + angleOffset;

        // ------ ★ 長さにランダム性を追加 ------
        float lenScale = mix(0.8, 1.2, hash1(fi * 5.31)); // 0.8〜1.2倍
        float lenBBase = 0.25;
        float lenCBase = 0.65;
        float lenB = lenBBase * lenScale;
        float lenC = lenCBase * lenScale;

        vec2 dirFin = vec2(cos(angle), sin(angle));

        vec2 A0 = tailBase;
        vec2 B0 = tailBase + lenB * dirFin;
        vec2 C0 = tailBase + lenC * dirFin;

        // 端ほど大きくしなるように振幅スケール
        float ampScale = 0.8 + 1.3 * abs(u);

        float freq   = 0.8;
        float ampB   = 0.10 * ampScale;
        float ampC   = 0.25 * ampScale;
        float phaseC = 0.0 + u * 0.5;

        // ------ ★ 厚みにランダム性を追加 ------
        float baseThickness = 0.008; // 基本厚み
        float thickScale = mix(0.1, 0.8, hash1(fi * 5.13)); // 0.7〜1.3倍
        float thickness = baseThickness * thickScale;

        // それぞれのフィンが、自分専用の厚みを持ったSDFを返す
        float dFin = sdTailFin(
            p,
            A0, B0, C0,
            freq, ampB, ampC, phaseC,
            thickness
        );

        d = min(d, dFin);
    }

    return d;
}

// -------------------- main --------------------
void main() {
    // 正規化座標 [-1,1]
    vec2 p = (2.0 * gl_FragCoord.xy - u_resolution.xy) / u_resolution.y;

    // 胴体
    float dBody = sdBettaBody(p);

    // 尾びれ（各線ごとに長さと厚みを持つ）
    float dTail = sdAllTailFins(p);

    // 胴体と尾びれの union
    float d = min(dBody, dTail);

    vec3 bg      = vec3(0.02, 0.03, 0.08);
    vec3 bodyCol = vec3(0.9, 0.25, 0.3);

    float mask = smoothstep(0.02, 0.0, d);

    vec3 color = mix(bg, bodyCol, mask);
    colour_out = vec4(color, 1.0);
}
`;



// ========== WebGL Setup ==========
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2');
if (!gl) alert("WebGL2 not supported");
gl.enable(gl.BLEND);

// SRC_ALPHA, ONE_MINUS_SRC_ALPHA は一般的な半透明ブレンド
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

// Compile
function compileShader(gl, type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    throw new Error("Shader error");
  }
  return shader;
}

const vs = compileShader(gl, gl.VERTEX_SHADER, VERT_SRC);
const fs = compileShader(gl, gl.FRAGMENT_SHADER, FRAG_SRC);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
  throw new Error("Link error");
}
gl.useProgram(program);

// Fullscreen Tri
const quadVerts = new Float32Array([
  -1, -1,
   3, -1,
  -1,  3,
]);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);

const loc = gl.getAttribLocation(program, "a_position");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

// Uniforms
const uResolution = gl.getUniformLocation(program, "u_resolution");
const uMouse      = gl.getUniformLocation(program, "u_mouse");
const uTime       = gl.getUniformLocation(program, "u_time");

let mouseX = 0, mouseY = 0;

canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = rect.height - (e.clientY - rect.top);
});

// ========== Render Loop ==========
const start = performance.now();
function render() {
  const t = (performance.now() - start) * 0.001;

  gl.useProgram(program);
  gl.bindVertexArray(vao);

  // Fixed size
  gl.viewport(0, 0, 300, 300);
  gl.uniform2f(uResolution, 300.0, 300.0);
  gl.uniform2f(uMouse, mouseX, mouseY);
  gl.uniform1f(uTime, t);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
